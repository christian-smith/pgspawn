name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Validate metadata and extract release notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import tomllib

          tag_name = os.environ["TAG_NAME"]
          if not tag_name.startswith("v"):
              raise SystemExit(f"expected a v-prefixed tag, got {tag_name}")

          tag_version = tag_name[1:]
          cargo = tomllib.loads(pathlib.Path("Cargo.toml").read_text())
          crate_version = cargo["package"]["version"]
          if tag_version != crate_version:
              raise SystemExit(
                  f"tag version {tag_version} does not match crate version {crate_version}"
              )

          changelog = pathlib.Path("CHANGELOG.md").read_text()
          heading = re.compile(
              rf"^## \[?{re.escape(tag_version)}\]? - \d{{4}}-\d{{2}}-\d{{2}}$"
          )
          lines = changelog.splitlines()
          notes = []
          inside = False
          for line in lines:
              if line.startswith("## "):
                  if inside:
                      break
                  if heading.fullmatch(line):
                      inside = True
                      continue
              if inside:
                  notes.append(line)

          release_notes = "\n".join(notes).strip()
          if not release_notes:
              raise SystemExit(
                  f"missing dated CHANGELOG.md section for version {tag_version}"
              )
          notes_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "pgspawn-release-notes.md"
          notes_path.write_text(release_notes + "\n")
          PY

      - name: Verify package
        run: cargo package --locked

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "$TAG_NAME" --notes-file "$RUNNER_TEMP/pgspawn-release-notes.md"
          else
            gh release create "$TAG_NAME" --verify-tag --title "$TAG_NAME" --notes-file "$RUNNER_TEMP/pgspawn-release-notes.md"
          fi
